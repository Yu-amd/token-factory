# Token Factory base Semantic Router Helm values (chart 0.3.0)
# Merged with generated/semantic-router-values.yaml at apply time.

env:
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-token-secret
        key: token

dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/vllm-project/semantic-router/dashboard
    tag: v0.3.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8700
    targetPort: 8700
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

dependencies:
  semanticCache:
    redis:
      enabled: false

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
