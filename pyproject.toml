[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-factory"
version = "0.1.0"
description = "AMD Token Factory reference architecture — config-driven semantic routing scaffold"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "AMD Enterprise AI" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
ui = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
]
mock = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
token-factory = "token_factory.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
