version: '1'
metadata:
  description: Supplementary model capability metadata for AMD Opinionated Routing Matrix. Separate from
    AIM support in aims.yaml. Capabilities are tri-state (true|false|unknown); workload strengths are
    qualitative policy inputs, not benchmark scores. Do not invent AMD measured performance.
  published: '2026-09-13'
  source_policy: Do not invent unsupported modalities; vision/coding/reasoning flags require name evidence
    or documented specialization.
  evidence_schema:
    capability_values:
    - 'true'
    - 'false'
    - unknown
    strength_values:
    - unknown
    - low
    - medium
    - high
    - very-high
    evidence_categories:
    - VERIFIED
    - PUBLIC_EVAL
    - MODEL_CARD
    - AMD_MEASURED
    - AMD_ESTIMATED
    - INFERRED
    - UNKNOWN
    maturity:
    - E0
    - E1
    - E2
    - E3
    - E4
    review_status:
    - verified
    - provisional
    - needs-review
  policy_version: '2.4'
