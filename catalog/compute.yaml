  - id: MI350P
    family: instinct
    display_name: AMD Instinct MI350P
    form_factor: PCIe
    deployment_class: [enterprise-server, oem, enterprise]
    # Positioning: between Radeon/EPYC workstation and rack-scale Instinct (MI350X/MI355X).
    # Not a performance alias of MI350X — conventional PCIe / OEM server footprint.
    deployment_positioning: between-workstation-and-rack-instinct
    characteristics:
      high_throughput: true
      large_model: true
      high_concurrency: true
      local_workstation: false
      edge_friendly: false
      pcie_form_factor: true
      oem_server: true
      conventional_pcie: true
      rack_scale: false
    # Multi-GPU communication not well optimized yet — prefer single-GPU TP1 only.
    tp_policy:
      preferred: 1
      max_recommended: 1
      multi_gpu_ok: false
      max_size_class_tp1: large
      note: TP>1 not well optimized on MI350P; recommend models that fit TP1.
    # Qualitative only — no measured $/hour or tokens/sec
    relative_cost_class: high
    hardware_cost_class: high
    token_economic_efficiency: null

