  - id: EPYC_9965
    family: epyc
    display_name: AMD EPYC 9965
    form_factor: cpu
    deployment_class: [datacenter, enterprise, edge]
    # CPU-centric / batch / low-QPS / fleet utilization — NOT a GPU interactive competitor.
    # Rises for batch/offline + relaxed/unconstrained latency; does NOT auto-rise for
    # high-concurrency interactive serving.
    positioning: cpu-batch-fleet
    characteristics:
      high_throughput: false
      large_model: false
      high_concurrency: false
      local_workstation: false
      edge_friendly: true
      cpu_inference: true
      batch_friendly: true
      fleet_utilization: true
    # CPU path — tensor parallel N/A (not a GPU TP schedule).
    tp_policy:
      preferred: 1
      max_recommended: 1
      multi_gpu_ok: false
      applies: false
      max_size_class_tp1: medium
    relative_cost_class: low
    hardware_cost_class: low
