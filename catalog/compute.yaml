# AMD compute targets referenced by catalog/aims.yaml.
# Characteristics are qualitative deployment traits — not benchmarks.
version: "1"
metadata:
  description: AMD compute catalog for opinionated routing (separate from AIM support).
  published: "2026-09-13"
  source: Derived from accelerators listed in catalog/aims.yaml / AMD Enterprise AI AIM matrix.

compute:
  - id: MI250X
    family: instinct
    display_name: AMD Instinct MI250X
    form_factor: OAM
    deployment_class: [datacenter]
    characteristics:
      high_throughput: true
      large_model: true
      high_concurrency: true
      local_workstation: false
      edge_friendly: false
      rack_scale: true
    # Multi-GPU tensor parallel OK on rack / OAM Instinct.
    tp_policy:
      preferred: 1
      max_recommended: 8
      multi_gpu_ok: true
      max_size_class_tp1: large
    relative_cost_class: high
    hardware_cost_class: high
    token_economic_efficiency: null

