# Enterprise use-case taxonomy for AMD Opinionated Routing Matrix.
# Capabilities are requirements for eligibility — not vendor marketing claims.
version: "1"
metadata:
  description: Workload taxonomy for Token Factory recommendation engine.
  published: "2026-09-13"
  policy_version: "2.3"

objectives:
  - id: balanced
    display_name: Balanced
  - id: token-cost
    display_name: Lowest Token Cost
  - id: lowest-cost-sufficient
    display_name: Lowest-Cost Sufficient
  - id: quality
    display_name: Highest Quality
  - id: latency
    display_name: Lowest Latency
  - id: throughput
    display_name: Highest Throughput
  - id: edge-local
    display_name: Local / Workstation First
  - id: enterprise
    display_name: Enterprise Production

# Maps V1 priority_mode values and policy profile names → matrix objectives
priority_mode_aliases:
  balanced: balanced
  cost: token-cost
  quality: quality
  latency: latency
  edge: edge-local
  enterprise: enterprise
  lowest-cost-sufficient: lowest-cost-sufficient
  local: edge-local
  workstation: edge-local
  privacy: edge-local
  # Policy pack names under policies/amd-*.yaml (preserve config names)
  amd-balanced: balanced
  amd-quality: quality
  amd-cost-efficient: token-cost
  amd-low-latency: latency
  amd-edge-first: edge-local
  amd-enterprise: enterprise

# Lifecycle filter modes (UI selector). Orthogonal to AIM support_level.
lifecycle_modes:
  production:
    display_name: Production
    allow: [ga]
    allow_preview: false
    allow_tech_preview: false
  production-preview:
    display_name: Production + Preview
    allow: [ga, preview]
    allow_preview: true
    allow_tech_preview: false
  evaluation:
    display_name: Tech Preview / Evaluation
    allow: [ga, preview, tech-preview]
    allow_preview: true
    allow_tech_preview: true
  all:
    display_name: All
    allow: [ga, preview, tech-preview, planned]
    allow_preview: true
    allow_tech_preview: true

# Preference labels (context-relevant advisory tags on selected cards / Rank #1)
preference_labels:
  - PERFORMANCE_PREFERRED
  - ECONOMIC_PREFERRED
  - BALANCED_PREFERRED
  - EDGE_LOCAL_PREFERRED
  - LOCAL_PREFERRED
  - WORKSTATION_PREFERRED
  - PRIVACY_PREFERRED
  - PRODUCTION_PREFERRED
  - EVALUATION_PREFERRED
  - BATCH_PREFERRED

# Serving patterns (Interactive ≠ high traffic; Batch ≠ high-concurrency interactive)
serving_patterns:
  - id: interactive
    display_name: Interactive
    default_latency: critical
  - id: online-throughput
    display_name: Online Throughput
    default_latency: important
  - id: batch
    display_name: Batch
    default_latency: relaxed
  - id: offline-batch
    display_name: Offline Batch
    default_latency: unconstrained

latency_requirements:
  - critical
  - important
  - relaxed
  - unconstrained

# Qualitative capability floors for lowest-cost-sufficient (deterministic).
# Model must meet or exceed floor via size_class / specialization heuristics — not raw parameter count ranking.
capability_floors:
  simple-chat: basic
  classification: basic
  code-completion: standard
  summarization: standard
  batch-summarization: standard
  offline-document-batch: standard
  extraction: standard
  structured-generation: standard
  rag-simple: standard
  translation: standard
  coding-assistant: standard
  enterprise-chat: high
  document-analysis: high
  rag-complex: high
  long-context-rag: high
  knowledge-assistant: high
  code-generation: high
  code-review: high
  general-reasoning: high
  tool-use-agent: high
  workflow-automation: high
  vlm: standard
  image-understanding: standard
  document-vision: high
  medical: high
  domain-specific-assistant: standard
  repository-reasoning: frontier
  software-engineering-agent: frontier
  complex-reasoning: frontier
  mathematical-reasoning: frontier
  scientific-reasoning: frontier
  enterprise-agent: frontier
  multi-step-agent: frontier
  multimodal-agent: frontier
  financial-analysis: frontier
  scientific: frontier

# Escalation continuum (explainable, policy-driven soft order — not a fixed route chain)
escalation_continuum:
  - epyc
  - radeon
  - MI350P
  - instinct-rack

