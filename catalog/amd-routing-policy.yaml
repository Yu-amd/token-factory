# AMD opinionated routing policy (SHOULD RUN) — separate from catalog/aims.yaml (CAN RUN).
version: "2.1"
metadata:
  amd_routing_policy:
    version: "2.1"
    published: "2026-09-13"
  description: >
    Explicit overrides and ranking rules for the Opinionated Routing Matrix.
    Generic scoring derives most cells; overrides encode AMD-style preferences.
    Lifecycle filtering: production excludes preview/tech-preview by default.

recommendation_levels:
  - PREFERRED
  - RECOMMENDED
  - ACCEPTABLE
  - SUPPORTED
  - NOT_SUPPORTED

# AIM support maturity ranks (from aims.yaml) — used for confidence, not eligibility alone.
aim_support_rank:
  optimized: 4
  preview: 3
  unoptimized: 2
  general: 1

# Hard rule: never recommend unoptimized above ACCEPTABLE unless override says otherwise.
unoptimized_max_level: ACCEPTABLE

# Lifecycle defaults (orthogonal to support_level)
lifecycle:
  default_ga: ga
  # Production / amd-enterprise
  production:
    allow_preview: false
    allow_tech_preview: false
  # Evaluation / Tech Preview / local workstation modes
  evaluation:
    allow_preview: true
    allow_tech_preview: true
  local:
    allow_preview: true
    allow_tech_preview: true

# Compute preference by objective (family order used as soft bias after capability filters).
# balanced is NOT simply MI355X > MI350X > MI300X by generation — see engine fit scores.
objective_compute_bias:
  token-cost: [epyc, radeon, instinct]
  lowest-cost-sufficient: [epyc, radeon, instinct]
  edge-local: [radeon, epyc, instinct]
  latency: [radeon, instinct, epyc]
  throughput: [instinct, radeon, epyc]
  quality: [instinct, epyc, radeon]
  enterprise: [instinct, epyc, radeon]
  balanced: [instinct, radeon, epyc]

# Size preference by objective (soft tie-break only — NOT the ranking algorithm).
objective_size_bias:
  token-cost: [small, medium, large, frontier]
  lowest-cost-sufficient: [small, medium, large, frontier]
  latency: [small, medium, large, frontier]
  edge-local: [small, medium]
  quality: [frontier, large, medium, small]
  throughput: [medium, large, frontier, small]
  enterprise: [large, medium, frontier, small]
  balanced: [medium, large, small, frontier]

# Escalation hints for explanations (local Radeon → MI350P → rack Instinct when needed)
escalation:
  local_to_datacenter: [radeon, MI350P, MI300X, MI350X, MI355X]
  notes: >
    Prefer local Radeon when capable; escalate to MI350P (PCIe enterprise) then
    rack-scale Instinct when capability floor or concurrency requires it.

# Explicit AMD-style overrides: use_case → model → compute → recommendation
# Only combinations that exist in aims (GA or tech-preview merge) are meaningful.
overrides:
