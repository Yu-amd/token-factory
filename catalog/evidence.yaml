    model: zai-org/GLM-4.7
    workload: coding-assistant
    metric: capability.coding
    value: true
    source: https://huggingface.co/zai-org/GLM-4.7
    source_type: MODEL_CARD
    date: "2025-12-22"
    methodology: official-model-card
    confidence: MODEL_CARD
    notes: >
      GLM-4.7 documented as coding partner with multilingual agentic coding and
      terminal-based tasks. No numeric Token Factory AMD measurement attached.

  - id: glm-47-model-card-reasoning
