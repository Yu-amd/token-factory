# Evidence catalog for Token Factory policy-quality governance.
# Token Factory is NOT a benchmark portal. Records influence policy confidence;
# missing evidence lowers confidence and must not be read as proof of inferiority.
# Do not invent $/token or AMD measured performance numbers.
version: "1"
metadata:
  description: >
    Structured provenance for model capability, public evaluations, and
    (future) AMD measurements. No metric values without provenance.
  published: "2026-09-13"
  policy_version: "2.4"
  evidence_categories:
    - VERIFIED
    - PUBLIC_EVAL
    - MODEL_CARD
    - AMD_MEASURED
    - AMD_ESTIMATED
    - INFERRED
    - UNKNOWN
  maturity_levels:
    E0: Unknown
    E1: Inferred
    E2: Official model documentation
    E3: Public validated evaluation
    E4: AMD measured
  performance_evidence_status:
    - AMD_MEASURED
    - PUBLIC_ONLY
    - ESTIMATED
    - NO_DATA

# Future ingest for first-party AMD measurements. Null / empty until measured.
amd_measurements: null

records:
