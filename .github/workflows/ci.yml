name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: pip install -e ".[dev,ui,mock]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Compile config
        run: token-factory compile

      - name: Verify generated dashboard flags
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("generated/semantic-router-values.yaml").read_text())
          assert data["dashboard"]["enabled"] is True
          assert data["dashboard"]["service"]["port"] == 8700
          print("dashboard config ok")
          PY

  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install package
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Compile SR values
        run: token-factory compile

      - name: Helm template Semantic Router 0.3.0 with dashboard
        run: |
          helm template semantic-router oci://ghcr.io/vllm-project/charts/semantic-router \
            --version 0.3.0 \
            -f deploy/helm/vllm-semantic-router/values.yaml \
            -f generated/semantic-router-values.yaml \
            > /tmp/sr-rendered.yaml
          grep -q "kind: Deployment" /tmp/sr-rendered.yaml
          grep -q "semantic-router-dashboard" /tmp/sr-rendered.yaml
          grep -q "8700" /tmp/sr-rendered.yaml
          echo "Helm render verified dashboard Deployment/Service on port 8700"
