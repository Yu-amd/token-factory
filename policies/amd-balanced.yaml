version: "1"
policy:
  name: amd-balanced
  description: Balance quality, latency, and cost across Instinct endpoints
  virtual_model: token-factory/auto
  priority_mode: balanced
  fallback:
    enabled: true
    chain: [gpt-oss-20b-general, gpt-oss-120b-coding]
  routes:
    - name: coding_route
      priority: 10
      domains: [computer science]
      endpoint_ref: gpt-oss-120b-coding
      lora_name: coding-expert
      model_card: coding-model
    - name: reasoning_route
      priority: 9
      domains: [math, physics, chemistry, engineering]
      endpoint_ref: gpt-oss-120b-coding
      lora_name: math-expert
      use_reasoning: true
      model_card: coding-model
    - name: general_route
      priority: 1
      domains: [business, history, economics, law, philosophy, psychology, other]
      endpoint_ref: gpt-oss-20b-general
      lora_name: general-expert
      model_card: fast-model
