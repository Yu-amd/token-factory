version: "1"
policy:
  name: amd-low-latency
  description: Prefer GPT-OSS 20B for minimum time-to-first-token
  virtual_model: token-factory/auto
  priority_mode: latency
  fallback:
    enabled: true
    chain: [gpt-oss-20b-general, gpt-oss-120b-coding]
  routes:
    - name: coding_route
      priority: 10
      domains: [computer science]
      endpoint_ref: gpt-oss-20b-general
      lora_name: coding-expert
      model_card: fast-model
    - name: general_route
      priority: 1
      domains: [business, history, economics, law, philosophy, psychology, other]
      endpoint_ref: gpt-oss-20b-general
      lora_name: general-expert
      model_card: fast-model
