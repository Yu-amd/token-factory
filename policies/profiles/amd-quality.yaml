version: '1'
policy:
  name: amd-quality
  description: Prefer flagship models for highest answer quality
  virtual_model: token-factory/auto
  priority_mode: quality
  fallback:
    enabled: true
    chain:
    - gpt-oss-120b-coding
    - gpt-oss-20b-general
  routes:
  - name: coding_route
    priority: 10
    domains:
    - computer science
    endpoint_ref: gpt-oss-120b-coding
    lora_name: openai/gpt-oss-120b
    model_card: coding-model
  - name: general_route
    priority: 5
    domains:
    - business
    - history
    - economics
    - law
    - philosophy
    - psychology
    - other
    endpoint_ref: gpt-oss-120b-coding
    lora_name: openai/gpt-oss-120b
    model_card: coding-model
  canonical_policy: policies/amd-policy.yaml
  overlay: &id001
    objective: quality
    priority_mode: quality
    lifecycle_strictness: production
    economic_preference: secondary
    performance_preference: maximize
    locality_preference: neutral
    comparison:
      primary_objective: Best Performance
      lifecycle_bias: Production
      economics: Tie-break only
      locality: Neutral
      typical_use: Quality-critical assistants
overlay: *id001
