version: '1'
policy:
  name: amd-cost-efficient
  description: Route to smaller/faster models unless coding intent detected
  virtual_model: token-factory/auto
  priority_mode: cost
  fallback:
    enabled: true
    chain:
    - gpt-oss-20b-general
  routes:
  - name: coding_route
    priority: 10
    domains:
    - computer science
    endpoint_ref: gpt-oss-120b-coding
    lora_name: openai/gpt-oss-120b
    model_card: coding-model
  - name: general_route
    priority: 1
    domains:
    - business
    - history
    - economics
    - law
    - philosophy
    - psychology
    - other
    endpoint_ref: gpt-oss-20b-general
    lora_name: openai/gpt-oss-20b
    model_card: fast-model
  canonical_policy: policies/amd-policy.yaml
  overlay: &id001
    objective: token-cost
    priority_mode: cost
    lifecycle_strictness: production
    economic_preference: minimize
    performance_preference: sufficient
    locality_preference: neutral
    comparison:
      primary_objective: Lowest-Cost Sufficient
      lifecycle_bias: Production
      economics: Primary
      locality: Neutral
      typical_use: Cost-sensitive chat / batch
overlay: *id001
