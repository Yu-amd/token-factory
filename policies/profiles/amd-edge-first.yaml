version: '1'
policy:
  name: amd-edge-first
  description: Prefer EPYC/Radeon suitable models when edge endpoints are configured
  virtual_model: token-factory/auto
  priority_mode: edge
  fallback:
    enabled: true
    chain:
    - gpt-oss-20b-general
  routes:
  - name: coding_route
    priority: 10
    domains:
    - computer science
    endpoint_ref: gpt-oss-120b-coding
    lora_name: openai/gpt-oss-120b
    model_card: coding-model
  - name: general_route
    priority: 1
    domains:
    - business
    - history
    - economics
    - law
    - philosophy
    - psychology
    - other
    endpoint_ref: gpt-oss-20b-general
    lora_name: openai/gpt-oss-20b
    model_card: fast-model
  canonical_policy: policies/amd-policy.yaml
  overlay: &id001
    objective: edge-local
    priority_mode: edge
    lifecycle_strictness: production-preview
    economic_preference: balanced
    performance_preference: sufficient
    locality_preference: prefer-local
    comparison:
      primary_objective: Local / Workstation First
      lifecycle_bias: Production + Preview
      economics: Balanced
      locality: Prefer local
      typical_use: Workstation / privacy / edge
overlay: *id001
