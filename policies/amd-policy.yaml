metadata:
  amd_routing_policy:
    version: '2.4'
    published: '2026-09-13'
    canonical_path: policies/amd-policy.yaml
  description: 'Explicit overrides and ranking rules for the Opinionated Routing Matrix. Generic scoring
    derives most cells; overrides encode AMD-style preferences with auditable policy_override fields.
    Lifecycle filtering: production excludes preview/tech-preview by default. Evidence governance v2.4.

    '
recommendation_levels: *id001
aim_support_rank: *id002
unoptimized_max_level: ACCEPTABLE
lifecycle: *id003
objective_compute_bias: *id004
objective_size_bias: *id005
escalation: *id006
overrides: *id007
