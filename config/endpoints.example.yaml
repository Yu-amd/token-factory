version: "1"
# Example inventory — prefer env placeholders (see config/.env.example).
endpoints:
  - id: gpt-oss-120b-coding
    host: ${MI300X_CODING_HOST:-127.0.0.1}
    port: ${MI300X_CODING_PORT:-8000}
    model: ${MI300X_CODING_MODEL:-openai/gpt-oss-120b}
    role: coding
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [coding, reasoning, flagship]
    description: GPT-OSS 120B on MI300X — coding / complex path

  - id: gpt-oss-20b-general
    host: ${MI300X_GENERAL_HOST:-127.0.0.1}
    port: ${MI300X_GENERAL_PORT:-8000}
    model: ${MI300X_GENERAL_MODEL:-openai/gpt-oss-20b}
    role: general
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [general, fast]
    description: GPT-OSS 20B on MI300X — routine / general path

  - id: gpt-oss-20b-spare
    host: ${MI300X_SPARE_HOST:-127.0.0.1}
    port: ${MI300X_SPARE_PORT:-8000}
    model: ${MI300X_SPARE_MODEL:-openai/gpt-oss-20b}
    role: general
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [general, spare, same-model-failover]
    description: Same-model secondary for general_route AIGW priority failover

  - id: mock-reasoning
    host: token-factory-mock-reasoning.token-factory.svc.cluster.local
    port: 8000
    model: mock/reasoning-v1
    role: reasoning
    hardware: instinct
    accelerator: MI300X
    aim_support: preview
    weight: 0.5
    enabled: false
    tags: [mock, test, kind]
    description: In-cluster mock reasoning backend for kind demos (disabled by default)
