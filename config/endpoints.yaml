version: "1"
# Hosts come from environment (see config/.env.example). No secrets in git.
endpoints:
  - id: gpt-oss-120b-coding
    host: ${MI300X_CODING_HOST:-165.245.131.224}
    port: ${MI300X_CODING_PORT:-8000}
    model: ${MI300X_CODING_MODEL:-openai/gpt-oss-120b}
    role: coding
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [coding, reasoning, flagship, live]
    description: GPT-OSS 120B on MI300X — coding / complex path (env-configured)

  - id: gpt-oss-20b-general
    host: ${MI300X_GENERAL_HOST:-129.212.176.75}
    port: ${MI300X_GENERAL_PORT:-8000}
    model: ${MI300X_GENERAL_MODEL:-openai/gpt-oss-20b}
    role: general
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [general, fast, live]
    description: GPT-OSS 20B on MI300X — routine / general path (env-configured)

  # Same-model replica for AIGW priority failover (general path only).
  # Cross-model failover is NOT claimed — compiler only emits same-model secondary refs.
  - id: gpt-oss-20b-spare
    host: ${MI300X_SPARE_HOST:-129.212.177.138}
    port: ${MI300X_SPARE_PORT:-8000}
    model: ${MI300X_SPARE_MODEL:-openai/gpt-oss-20b}
    role: general
    hardware: instinct
    accelerator: MI300X
    aim_support: optimized
    weight: 1
    enabled: true
    tags: [general, spare, same-model-failover, live]
    description: GPT-OSS 20B spare MI300X — same-model secondary for general_route

  - id: mock-reasoning
    host: token-factory-mock-reasoning.token-factory.svc.cluster.local
    port: 8000
    model: mock/reasoning-v1
    role: reasoning
    hardware: instinct
    accelerator: MI300X
    aim_support: preview
    weight: 0.5
    enabled: false
    tags: [mock, test, kind]
    description: In-cluster mock reasoning backend for kind demos (disabled by default)
